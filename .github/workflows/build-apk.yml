name: build-apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No `android-actions/setup-android` step: on ubuntu-24.04 the image's
      # bundled sdkmanager is broken (cmdline-tools/16.0 exits 1 with
      # "Failed to find package 'tools'"), and the SDK is already installed
      # at /usr/local/lib/android/sdk with licences accepted.

      - name: Install npm dependencies
        run: npm ci

      - name: Vendor chess.js into the web bundle
        run: npm run build:web

      # Stockfish is GPL-3.0; we fetch the official release build rather than
      # committing a 100MB binary to git. Override STOCKFISH_URL for a pin.
      - name: Fetch Stockfish (official arm64 build)
        env:
          STOCKFISH_URL: ${{ vars.STOCKFISH_URL || 'https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz' }}
        run: |
          set -euo pipefail
          mkdir -p stockfish
          curl -fsSL "$STOCKFISH_URL" -o /tmp/sf.tar.gz
          tar -xzf /tmp/sf.tar.gz -C stockfish --strip-components=1
          chmod +x stockfish/stockfish-android-arm64-universal
          stockfish/stockfish-android-arm64-universal <<< $'uci\nquit' | grep -m1 uciok

      # The android/ project is committed, so only generate it when missing.
      - name: Prepare Android project
        run: |
          set -euo pipefail
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Place the engine in jniLibs
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp stockfish/stockfish-android-arm64-universal \
             android/app/src/main/jniLibs/arm64-v8a/libstockfishengine.so

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-review-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: chess-review-debug
          path: apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Chess Review (latest)
          files: apk/app-debug.apk
          body: |
            Auto-built from the last commit.
            Engine: Stockfish 19 (GPL-3.0) bundled as jniLibs.
